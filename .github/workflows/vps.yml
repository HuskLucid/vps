name: Persistent VPS with Tailscale & Telegram Storage

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
  DATA_DIR: /home/runner/data

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openssh-server

      - name: Install Python packages
        run: |
          pip3 install flask python-telegram-bot==20.7 telegram-upload

      # 🔧 FIXED RESTORE STEP – using --bot instead of --bot-token
      - name: Restore persistent data from Telegram
        run: |
          mkdir -p $DATA_DIR
          cd $DATA_DIR
          # telegram-download uses --bot (not --bot-token)
          telegram-download --bot $BOT_TOKEN --chat-id $CHANNEL_ID --glob "backup.part*" || echo "No backup found"
          if ls backup.part* 1> /dev/null 2>&1; then
            cat backup.part* > backup.tar.gz
            tar -xzf backup.tar.gz
            rm backup.tar.gz backup.part*
            echo "✅ Data restored successfully."
          else
            echo "ℹ️  No previous backup – starting fresh."
          fi

      - name: Setup SSH key for passwordless login
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo /usr/sbin/sshd -D &

      - name: Start SSH daemon
        run: |
          sudo mkdir -p /var/run/sshd
          sudo /usr/sbin/sshd -D &
          sleep 2
          echo "SSH daemon started."

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscaled &
          sleep 5
          sudo tailscale up --authkey $TAILSCALE_AUTHKEY --hostname=github-vps
          echo "✅ Tailscale connected."
          echo "Your Tailscale IP is:"
          tailscale ip -4

      - name: Start Flask web server
        run: |
          cd $DATA_DIR
          cat > app.py <<'EOF'
          from flask import Flask
          app = Flask(__name__)
          @app.route('/')
          def home():
              return "VPS is alive! Data directory: /home/runner/data"
          app.run(host='0.0.0.0', port=8080)
          EOF
          nohup python3 app.py &

      - name: Keep alive loop
        run: |
          echo "🔄 VPS is running – will stay alive until 6h limit."
          while true; do sleep 60; done

      - name: Backup data to Telegram
        if: always()
        run: |
          cd $DATA_DIR
          tar -czf backup.tar.gz .
          split -b 1900M backup.tar.gz backup.part
          for chunk in backup.part*; do
            telegram-upload --bot-token $BOT_TOKEN --chat-id $CHANNEL_ID "$chunk"
            rm "$chunk"
          done
          rm backup.tar.gz
          echo "✅ Backup completed."
