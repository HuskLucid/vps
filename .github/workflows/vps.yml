name: Persistent VPS with Tailscale & Telegram Storage

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
  DATA_DIR: /home/runner/data

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openssh-server

      - name: Install Python packages
        run: |
          pip3 install flask python-telegram-bot==20.7 telegram-upload requests

      # 🔥 RESTORE VIA PYTHON SCRIPT (fixes CLI issue)
      - name: Restore persistent data from Telegram
        run: |
          mkdir -p $DATA_DIR
          cd $DATA_DIR
          cat > restore.py <<'EOF'
          import os
          import requests
          import subprocess

          TOKEN = os.environ['BOT_TOKEN']
          CHAT_ID = os.environ['CHANNEL_ID']
          DATA_DIR = os.environ['DATA_DIR']

          # Get updates from the channel
          url = f"https://api.telegram.org/bot{TOKEN}/getUpdates"
          params = {"chat_id": CHAT_ID, "limit": 100}
          response = requests.get(url, params=params)
          if response.status_code != 200:
              print("⚠️  No updates found – starting fresh.")
              exit(0)

          data = response.json()
          part_files = []
          for result in data.get('result', []):
              msg = result.get('channel_post') or result.get('message')
              if not msg:
                  continue
              if 'document' in msg:
                  file_name = msg['document']['file_name']
                  if file_name.startswith('backup.part'):
                      part_files.append({
                          'file_id': msg['document']['file_id'],
                          'file_name': file_name
                      })

          if not part_files:
              print("ℹ️  No backup chunks found – starting fresh.")
              exit(0)

          # Download chunks
          for part in part_files:
              file_id = part['file_id']
              file_name = part['file_name']
              url = f"https://api.telegram.org/bot{TOKEN}/getFile?file_id={file_id}"
              response = requests.get(url)
              if response.status_code != 200:
                  continue
              file_path = response.json()['result']['file_path']
              download_url = f"https://api.telegram.org/file/bot{TOKEN}/{file_path}"
              with open(file_name, 'wb') as f:
                  f.write(requests.get(download_url).content)
              print(f"✅ Downloaded {file_name}")

          # Reassemble
          subprocess.run(["cat"] + [p['file_name'] for p in part_files] + [">", "backup.tar.gz"], shell=True)
          subprocess.run(["tar", "-xzf", "backup.tar.gz", "-C", DATA_DIR])
          print("✅ Data restored successfully.")
          EOF
          python3 restore.py

      - name: Setup SSH key for passwordless login
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PUBLIC_KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          sudo sed -i 's/#PubkeyAuthentication yes/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo /usr/sbin/sshd -D &

      - name: Start SSH daemon
        run: |
          sudo mkdir -p /var/run/sshd
          sudo /usr/sbin/sshd -D &
          sleep 2
          echo "SSH daemon started."

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscaled &
          sleep 5
          sudo tailscale up --authkey $TAILSCALE_AUTHKEY --hostname=github-vps
          echo "✅ Tailscale connected."
          echo "Your Tailscale IP is:"
          tailscale ip -4

      - name: Start Flask web server
        run: |
          cd $DATA_DIR
          cat > app.py <<'EOF'
          from flask import Flask
          app = Flask(__name__)
          @app.route('/')
          def home():
              return "VPS is alive! Data directory: /home/runner/data"
          app.run(host='0.0.0.0', port=8080)
          EOF
          nohup python3 app.py &

      - name: Keep alive loop
        run: |
          echo "🔄 VPS is running – will stay alive until 6h limit."
          while true; do sleep 60; done

      - name: Backup data to Telegram
        if: always()
        run: |
          cd $DATA_DIR
          tar -czf backup.tar.gz .
          split -b 1900M backup.tar.gz backup.part
          for chunk in backup.part*; do
            telegram-upload --bot-token $BOT_TOKEN --chat-id $CHANNEL_ID "$chunk"
            rm "$chunk"
          done
          rm backup.tar.gz
          echo "✅ Backup completed."
