name: Persistent VPS with Tailscale & Telegram Storage

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours
  workflow_dispatch:

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  DATA_DIR: /home/runner/data

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # runs for ~5h50m, safe margin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------
      # 1. Install base packages
      # ----------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openssh-server

      # ----------------------------------------------
      # 2. Install Python packages
      # ----------------------------------------------
      - name: Install Python packages
        run: |
          pip3 install flask python-telegram-bot==20.7 telegram-upload

      # ----------------------------------------------
      # 3. Restore data from Telegram
      # ----------------------------------------------
      - name: Restore persistent data from Telegram
        run: |
          mkdir -p $DATA_DIR
          cd $DATA_DIR
          # Download all chunks (named backup.part*)
          telegram-download --bot-token $BOT_TOKEN --chat-id $CHANNEL_ID --glob "backup.part*" || echo "No backup found"
          if ls backup.part* 1> /dev/null 2>&1; then
            cat backup.part* > backup.tar.gz
            tar -xzf backup.tar.gz
            rm backup.tar.gz backup.part*
            echo "✅ Data restored successfully."
          else
            echo "ℹ️  No previous backup – starting fresh."
          fi

      # ----------------------------------------------
      # 4. Install & start SSH server (for Termius)
      # ----------------------------------------------
      - name: Start SSH daemon
        run: |
          sudo mkdir -p /var/run/sshd
          sudo /usr/sbin/sshd -D &
          sleep 2
          echo "SSH daemon started (port 22)."

      # ----------------------------------------------
      # 5. Install Tailscale and connect
      # ----------------------------------------------
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo tailscaled &
          sleep 5
          sudo tailscale up --authkey $TAILSCALE_AUTHKEY --hostname=github-vps
          echo "✅ Tailscale connected."
          echo "Your Tailscale IP is:"
          tailscale ip -4

      # ----------------------------------------------
      # 6. Start your main service (Flask example)
      # ----------------------------------------------
      - name: Start Flask web server
        run: |
          cd $DATA_DIR
          cat > app.py <<'EOF'
          from flask import Flask
          app = Flask(__name__)
          @app.route('/')
          def home():
              return "VPS is alive! Data directory: /home/runner/data"
          app.run(host='0.0.0.0', port=8080)
          EOF
          nohup python3 app.py &

      # ----------------------------------------------
      # 7. Keep the job alive (prevents early exit)
      # ----------------------------------------------
      - name: Keep alive loop
        run: |
          echo "🔄 VPS is running – will stay alive until 6h limit."
          while true; do sleep 60; done

      # ----------------------------------------------
      # 8. Backup data to Telegram (always runs, even on cancel)
      # ----------------------------------------------
      - name: Backup data to Telegram
        if: always()
        run: |
          cd $DATA_DIR
          # Archive and split into 1.9 GB chunks
          tar -czf backup.tar.gz .
          split -b 1900M backup.tar.gz backup.part
          # Upload each chunk
          for chunk in backup.part*; do
            telegram-upload --bot-token $BOT_TOKEN --chat-id $CHANNEL_ID "$chunk"
            rm "$chunk"
          done
          rm backup.tar.gz
          echo "✅ Backup completed."
